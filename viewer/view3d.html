<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogline 3D</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #d9d7cf;
  --p1: #2f6db5; --p2: #c23b3b; --p3: #2f8f5b; --p4: #7a4fb3; --p5: #c98a1b; --p6: #1f9aa8; --p7: #b54a8a; --p8: #6b6b6b;
  --ground: #a9b58a; --ground-hi: #c4c9a0; --cliff: #8a8478; --water: #5d8fb8; --fish: #c9d6df; --sky: #dfe6ea;
  --tree: #4f6f3a; --stealth: #c9b35a; --forest-floor: #5f7340; --age1: #8a6a4a; --age2: #8a8f96; --age3: #d3d7dc; --age4: #d4af37; --trunk: #6b4f35; --berry: #43a321; --gold: #d8b23a; --stone: #9a9a96; --deer: #c0528a;
  --animal: #8a6a4a; --relic: #f2f0e6; --slab: #a9b58a; --site: #d8c58a; --trade: #b58f63;
  --horse: #7a5a3e; --camel: #b8996a; --elephant: #8d8a86; --steel: #b9bcc0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --panel: #22221f; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3934;
  --p1: #6aa3e8; --p2: #ec6f6f; --p3: #5cc28a; --p4: #a986e0; --p5: #e8b04f; --p6: #4fc4d1; --p7: #e07ab8; --p8: #a0a0a0;
  --ground: #5b6448; --ground-hi: #6f7856; --cliff: #615c53; --water: #3d6584; --fish: #9fb0bc; --sky: #1c2226;
  --tree: #3a5530; --stealth: #a8964a; --forest-floor: #3e4d2b; --age1: #8a6a4a; --age2: #7d838a; --age3: #c9ccd0; --age4: #d4af37; --trunk: #5a4430; --berry: #7ccf4f; --gold: #d8b23a; --stone: #8a8a86; --deer: #d97aa8;
  --animal: #8a6a4a; --relic: #e6e4da; --slab: #5b6448; --site: #bfae78; --trade: #9a7a55;
  --horse: #6a4e36; --camel: #a08458; --elephant: #7c7974; --steel: #c9ccd0;
} }
:root[data-theme="dark"] {
  --bg: #161614; --panel: #22221f; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3934;
  --p1: #6aa3e8; --p2: #ec6f6f; --p3: #5cc28a; --p4: #a986e0; --p5: #e8b04f; --p6: #4fc4d1; --p7: #e07ab8; --p8: #a0a0a0;
  --ground: #5b6448; --ground-hi: #6f7856; --cliff: #615c53; --water: #3d6584; --fish: #9fb0bc; --sky: #1c2226;
  --tree: #3a5530; --stealth: #a8964a; --forest-floor: #3e4d2b; --age1: #8a6a4a; --age2: #7d838a; --age3: #c9ccd0; --age4: #d4af37; --trunk: #5a4430; --berry: #7ccf4f; --gold: #d8b23a; --stone: #8a8a86; --deer: #d97aa8;
  --animal: #8a6a4a; --relic: #e6e4da; --slab: #5b6448; --site: #bfae78; --trade: #9a7a55;
  --horse: #6a4e36; --camel: #a08458; --elephant: #7c7974; --steel: #c9ccd0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#wrap { display: flex; flex-direction: column; height: 100%; }
#bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); }
#bar .players span { margin-right: 10px; }
/* owner 2026-11-13: the second toolbar row (overlays, water, unit size ...) collapses with the "settings" button */
#bar2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex-basis: 100%; } #bar.collapsed #bar2 { display: none; }
#barMore.on { border-color: var(--ink); }
#bar .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
#stage { position: relative; flex: 1; min-height: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#bottom { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel);
  border-top: 1px solid var(--line); }
#t { flex: 1; }
#clock { font-variant-numeric: tabular-nums; min-width: 92px; }
button, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 8px; cursor: pointer; }
label { color: var(--muted); }
#help { position: absolute; left: 10px; bottom: 192px; color: var(--muted); font-size: 12px; pointer-events: none;
  text-shadow: 0 0 3px var(--bg); }
/* selection (owner 2026-11-13): drag rectangle, summary of the selected units, swap button lit while on */
#selRect { position: absolute; display: none; border: 1px solid #fff; background: rgba(255, 255, 255, .12); pointer-events: none; z-index: 5; }
#selBox { position: absolute; left: 10px; bottom: 212px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 60%;
  font-size: 12px; color: var(--ink); background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 8px; pointer-events: none; }
#selBox .aic { display: inline-flex; align-items: center; gap: 2px; border-bottom: 2px solid; font-weight: 600; }
#selBox { flex-direction: column; align-items: stretch; pointer-events: auto; max-height: 40%; overflow: auto; }
#selBox .sh { display: flex; gap: 8px; align-items: baseline; } #selBox .sr { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; align-items: center;
  padding: 3px 0; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
#selBox .sr .ic { grid-row: 1 / 4; } #selBox .sr .ic img { width: 34px; height: 34px; border-radius: 3px; }
#selBox .st { font-variant-numeric: tabular-nums; } #selBox .st span { margin-right: 10px; white-space: nowrap; }
#selBox .bf { color: #ffe9a8; } #selBox .hpb { display: inline-block; width: 60px; height: 5px; background: var(--line); border-radius: 2px; overflow: hidden; vertical-align: middle; }
#selBox .hpb i { display: block; height: 100%; background: #7fd34e; }
#selBox .aic img { width: 24px; height: 24px; } #selBox .nm { font-size: 11px; font-weight: 400; } #selBox small { color: var(--muted); }
/* build order (owner 2026-11-13: "list the order until the 6 min mark on each side, aoe4 guide style") */
#boPanel { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); width: min(1100px, 96%); max-height: calc(100% - 330px);
  overflow: auto; z-index: 6; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px 10px; font-size: 12px; color: var(--ink); }
#boPanel .boh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#boPanel .bocols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
#boPanel table { width: 100%; border-collapse: collapse; } #boPanel th { font-weight: 600; color: var(--muted); font-size: 11px; padding: 2px 3px; }
#boPanel td { padding: 2px 3px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: middle; }
#boPanel tr.st { cursor: pointer; } #boPanel tr.st:hover td { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#boPanel tr.fut td { opacity: .45; } #boPanel tr.cur td { background: color-mix(in srgb, var(--p1) 14%, transparent); }
#boPanel td.n { text-align: center; font-variant-numeric: tabular-nums; width: 22px; } #boPanel td.tm { font-variant-numeric: tabular-nums; color: var(--muted); width: 36px; }
#boPanel td.z { color: var(--muted); }
#boPanel .vb { display: flex; height: 6px; width: 64px; border-radius: 2px; overflow: hidden; background: var(--line); } #boPanel .vb i { display: block; height: 100%; }
#boPanel .act { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; } #boPanel .act img { width: 22px; height: 22px; border-radius: 3px; }
#boPanel .age { font-weight: 700; color: #f0c040; }
#swapSides.on { background: color-mix(in srgb, var(--p1) 30%, var(--bg)); border-color: var(--ink); }
.hud { position: absolute; pointer-events: none; font-size: 11px; color: var(--ink); }
#hudB .box { padding: 2px 0 !important; }
.hud .box { background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; pointer-events: auto; }
#hudL { left: 8px; top: 8px; max-width: 34%; } #hudR { right: 8px; top: 8px; max-width: 34%; text-align: right; }
#hudM { left: 50%; top: 8px; transform: translateX(-50%); max-width: 30%; text-align: center; }
#hudTopWrap { position: absolute; top: 6px; left: 8px; right: 8px; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
#hudTop { width: 100%; } #hudTopWrap #hudM { position: absolute; left: 0; right: 0; top: 0; transform: none; max-width: none; }
/* standing army (owner 2026-11-11): bigger, split at the middle of the screen - player 1 left of it, player 2 right */
/* owner 2026-11-13: the army rows sit beside the centre box (villagers / army value / clock), left and right of it; showHud sets
   the columns from the box's position: [left of the box] [the box] [right of the box] */
.asplit { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.asplit .arow.r { grid-column: 3; }
/* owner 2026-11-13: four parts (melee infantry | ranged infantry | cavalry | siege) from the centre box outwards */
.arow.segd { display: grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, .5fr); gap: 0; padding: 3px 2px; box-sizing: border-box; }
.arow.segd.l { grid-template-columns: minmax(0, .5fr) repeat(4, minmax(0, 1fr)); }
/* boxed mode: smaller chips so a unit fits in its part (owner 2026-11-13: five parts at 1600 px are ~55 px each) */
.asplit .arow.segd .aic img { width: 28px; height: 28px; } .arow.segd .aic { font-size: 12px; gap: 1px; } .arow.segd .seg { padding: 0 3px; gap: 2px 4px; }   /* the fifth, smaller part: religious / other, outermost */
.arow.segd .seg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 6px; min-height: 38px; border-left: 1px solid color-mix(in srgb, var(--line) 80%, transparent); }
.arow.segd .seg:first-child { border-left: 0; } .arow.segd.l .seg { justify-content: flex-end; }
.asplit.q .arow.segd .seg { min-height: 26px; }
.arow.segd .segl { font-size: 10px; font-weight: 400; color: color-mix(in srgb, var(--muted) 55%, transparent); width: 100%; text-align: center; }
/* armies box (owner 2026-11-13: team games): every player, the same four parts; dragged by its header */
/* minimap (owner 2026-11-13: toggleable and movable); diamond like the in-game minimap (+x +z up) */
#miniBox { position: absolute; left: 8px; top: 290px; z-index: 6; background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 8px; padding: 3px 5px 5px; }
#miniBox .mbh { display: flex; justify-content: space-between; align-items: center; cursor: move; font-size: 12px; padding-bottom: 2px; }
#miniBox .mbh button, #miniBox .mbh select { font-size: 10px; padding: 0 5px; } #miniCv { display: block; cursor: crosshair; }
#armyBox { position: absolute; left: 50%; top: 160px; transform: translateX(-50%); z-index: 6; min-width: 520px; max-width: 94%; max-height: 60%; overflow: auto;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 8px; font-size: 12px; color: var(--ink); }
#armyBox .abh { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: move; padding-bottom: 3px; }
#armyBox table { border-collapse: collapse; width: 100%; } #armyBox th { font-weight: 400; color: var(--muted); font-size: 11px; text-align: left; padding: 2px 6px; }
#armyBox td { padding: 3px 6px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); vertical-align: middle; }
#armyBox td.seg { border-left: 1px solid color-mix(in srgb, var(--line) 70%, transparent); } #armyBox .aic { display: inline-flex; align-items: center; gap: 2px; margin: 1px 6px 1px 0; font-weight: 600; }
#armyBox .aic img { width: 30px; height: 30px; border-radius: 3px; } #armyBox .segl { color: var(--muted); font-size: 10px; }
/* kills box (owner 2026-11-14): everything killed so far, per player that lost it; toggled, closable, dragged by its header */
#killBox { position: absolute; right: 8px; top: 160px; z-index: 6; min-width: 360px; max-width: 60%; max-height: 60%; overflow: auto;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 8px; font-size: 12px; color: var(--ink); }
#killBox .abh { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: move; padding-bottom: 3px; }
#killBox table { border-collapse: collapse; width: 100%; } #killBox th { font-weight: 400; color: var(--muted); font-size: 11px; text-align: left; padding: 2px 6px; }
#killBox td { padding: 3px 6px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); vertical-align: middle; }
#killBox .aic { display: inline-flex; align-items: center; gap: 2px; margin: 1px 6px 1px 0; font-weight: 600; }
#killBox .aic img { width: 26px; height: 26px; border-radius: 3px; } #killBox .segl { color: var(--muted); font-size: 10px; } #killBox td.n { text-align: right; white-space: nowrap; }
/* APM box (owner 2026-11-15): per player a vertical bar, fill = APM / eAPM over the last 60 s, float = the match's peak so far */
#apmBox { position: absolute; right: 8px; top: 300px; z-index: 6; max-height: calc(100% - 16px); overflow: auto; background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 8px; font-size: 12px; color: var(--ink); }
#apmBox .abh { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: move; padding-bottom: 3px; }
#apmBox .ctl { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding-bottom: 8px; }
#apmBox .ctl input[type=range] { width: 90px; }
#apmBox .cols { display: flex; gap: 34px; justify-content: center; padding-right: 30px; }
#apmBox .col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
#apmBox .bar { position: relative; width: 30px; height: 220px; margin: 6px 0 4px 26px; border: 1px solid var(--line); border-radius: 3px;
  background: color-mix(in srgb, var(--line) 25%, transparent); }
#apmBox .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0 0 2px 2px; opacity: .85; }
#apmBox .notch { position: absolute; left: -4px; right: 0; border-top: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); }
#apmBox .notch span { position: absolute; right: 100%; top: -7px; padding-right: 3px; font-size: 10px; color: var(--muted); }
#apmBox .peak { position: absolute; left: -3px; right: -3px; height: 0; border-top: 3px solid var(--ink); }
#apmBox .peak span { position: absolute; left: 100%; top: -9px; padding-left: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
#apmBox .num { font-size: 15px; font-weight: 700; } #apmBox small { color: var(--muted); }
#apmBox .seg { position: absolute; left: 0; right: 0; }
#apmBox table { border-collapse: collapse; margin-top: 8px; width: 100%; font-size: 11px; }
#apmBox th { font-weight: 400; color: var(--muted); text-align: right; padding: 1px 5px; } #apmBox th:first-child { text-align: left; }
#apmBox td { padding: 1px 5px; text-align: right; white-space: nowrap; } #apmBox td:first-child { text-align: left; }
#apmBox tr.grp td { color: var(--muted); padding-top: 5px; border-bottom: 1px solid var(--line); }
#apmBox .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.asplit .arow { margin: 0; padding: 4px 10px; justify-content: flex-start; font-size: 14px; font-weight: 600; gap: 6px; flex-wrap: wrap; }
.asplit .arow.l { justify-content: flex-end; justify-self: end; border-radius: 6px; }
.asplit .arow.r { justify-self: start; border-radius: 6px; }
.asplit .aic img { width: 36px; height: 36px; } .asplit .aic { gap: 2px; }
/* military in the queue (hindsight: what the producing buildings turned out next) - under the army, less accented */
.asplit.q { margin-top: 2px; } .asplit.q .arow { background: color-mix(in srgb, var(--panel) 55%, transparent); border-style: dashed; font-size: 12px; font-weight: 400; color: var(--muted); padding: 2px 8px; }
.asplit.q .aic img { width: 24px; height: 24px; opacity: .85; }
.asplit.nav { margin-top: 2px; } .asplit.nav .arow { font-size: 12px; padding: 2px 8px; min-height: 30px; }
.asplit.nav .aic img { width: 28px; height: 28px; } .asplit.nav .aic.nq { opacity: .55; font-weight: 400; }
.asplit.nav .segl { font-size: 10px; font-weight: 400; color: color-mix(in srgb, var(--muted) 55%, transparent); }
.asplit .aic .nm { font-size: 11px; font-weight: 400; max-width: 70px; overflow: hidden; white-space: nowrap; }
#hudStatsBox { left: 8px; bottom: 6px; min-width: 230px; }
/* owner 2026-11-11: as tall as the graph beside it (#hudB 180 px), rows spread over the height */
#hudStatsBox .fh-box { height: 180px; box-sizing: border-box; display: flex; } #hudStatsBox .fh-box table { height: 100%; width: 100%; }  /* above play / speed / clock; the seek bar starts right of it */ /* owner 2026-11-13: stats / graph hidden and shown from the boxes themselves (Hide ▾ / Show … ▸), like the fight recap */
button.mini { font-size: 11px; padding: 1px 7px; } #gHead #gHide { margin-left: auto; }
.dockb { position: absolute; bottom: 8px; z-index: 4; background: color-mix(in srgb, var(--panel) 90%, transparent); }
#hudRecapBox { right: 8px; bottom: 196px; } #hudRecapBox .fh-rtitle, #hudRecapBox .fh-rh { cursor: move; }
#hudB { left: 8px; right: 8px; bottom: 6px; height: 180px; }
#hudB canvas { width: 100%; flex: 1; min-height: 0; display: block; }
#gHead { display: flex; gap: 8px; align-items: center; padding: 0 4px 2px; font-size: 11px; white-space: nowrap; overflow: hidden; }
#gHead select { padding: 0 4px; font-size: 11px; } #gVals { margin-left: auto; display: flex; gap: 12px; }
#gVals .r { color: var(--muted); font-weight: 400; }
.trow { display: flex; flex-wrap: wrap; gap: 2px; margin: 2px 0; align-items: center; }
#hudR .trow { justify-content: flex-end; }
.trow .lab { color: var(--muted); font-size: 10px; width: 34px; }
.tic { position: relative; width: 26px; height: 30px; display: inline-flex; flex-direction: column; align-items: center; }
.tic img, .tic .chip { width: 24px; height: 24px; border-radius: 3px; }
.tic .chip { background: var(--line); font-size: 8px; line-height: 24px; overflow: hidden; text-align: center; }
.tic .notch { display: flex; gap: 1px; height: 4px; margin-top: 1px; }
.tic .notch i { width: 5px; height: 3px; background: var(--line); border-radius: 1px; } .tic .notch i.on { background: #e8b04f; }
.arow { display: flex; gap: 3px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 1px 0; }
.arow .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.aic { display: inline-flex; align-items: center; gap: 1px; } .aic img { width: 20px; height: 20px; border-radius: 3px; }
#err { position: absolute; inset: 40% 10% auto; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <strong>Fogline 3D</strong><span style="color:var(--muted);font-size:10px" title="page version">p80</span><span class="players" id="players"></span>
    <label title="fog of war from the game's own visibility flags">View <select id="obs"><option value="0">Everything</option></select></label>
    <label>Fight <select id="fight"><option value="">whole map</option></select></label>
    <button id="boBtn" title="each player's build order up to 6:00, aoe4guides style: villagers per resource at each step, buildings placed, units queued, research started, age-ups (click a row = jump there). Sight view: your own only">build order</button>
    <button id="miniBtn" title="minimap: terrain, resources, units and your current view; click / drag on it moves the camera; drag the box by its header">minimap</button>
    <button id="armyBtn" title="every player's army in a box (melee infantry / ranged infantry / cavalry / siege) - for team games; drag it by its header">armies</button>
    <button id="killBtn" title="everything killed so far (units, villagers, buildings), per player that lost it, with the resource value of the units; both players in full in every view, like the observer bar; drag it by its header">kills</button>
    <button id="apmBtn" title="APM / eAPM per player: the bar fills with the actions of the last 60 s of game time, the marker on top stays at the highest so far this match; eAPM leaves out move spam (the same units moved again within 2 s with no attack order in between); both players in full in every view, like the observer bar; drag it by its header">APM</button>
    <button id="swapSides" title="swap the two players' sides in the top bar, army row, stats and recap (when the camera angle puts their armies on the other side)">⇄ swap sides</button>
    <label title="look through a player's own camera (replay file); drag / wheel / keys go back to the free camera. Sight view: your own camera only">Camera <select id="follow"><option value="0">free</option></select></label>
    <button id="barMore" title="show / hide the second row of settings (overlays, water, unit size ...); remembered">⚙ settings ▾</button>
    <div id="bar2">
    <label title="each player's camera view on the ground (replay file); sight view: your own only"><input type="checkbox" id="camT" checked> cameras</label>
